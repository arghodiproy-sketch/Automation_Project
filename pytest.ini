[pytest]
# ─────────────────────────────────────────────────────────────────────────────
# pytest.ini — central pytest configuration
#
# Interview Tip:
#   pytest.ini controls test discovery, markers, log format, and default
#   CLI options.  Knowing this file shows you understand the full framework
#   lifecycle, not just writing tests.
# ─────────────────────────────────────────────────────────────────────────────

# Add the project root to sys.path so all imports work without installation.
# e.g. "from pages.web.google_home_page import GoogleHomePage"
pythonpath = .

# Default CLI flags applied to every pytest run.
# -v         → verbose output (each test name printed)
# --tb=short → short traceback on failure (not the full wall of text)
addopts =
    -v
    --tb=short

# ─────────────────────────────────────────────────────────────────────────────
# Custom markers
# Interview Tip: always register markers here to avoid
# PytestUnknownMarkWarning and to document what each marker means.
#
# Run only one platform:
#   pytest -m desktop
#   pytest -m mobile
#   pytest -m web
#
# Exclude a platform:
#   pytest -m "not mobile"
#
# Combine markers:
#   pytest -m "desktop or web"
# ─────────────────────────────────────────────────────────────────────────────
markers =
    desktop:    Windows desktop app tests  (requires pywinauto)
    mobile:     Android mobile tests       (requires Appium + emulator)
    web:        Browser-based tests        (requires Selenium + ChromeDriver)
    smoke:      Quick sanity-check subset of tests
    regression: Full regression test suite

# ─────────────────────────────────────────────────────────────────────────────
# Live logging — shows log output in the terminal as tests run.
# ─────────────────────────────────────────────────────────────────────────────
log_cli          = true
log_cli_level    = INFO
log_format       = %(asctime)s [%(levelname)-8s] %(name)s: %(message)s
log_date_format  = %H:%M:%S
