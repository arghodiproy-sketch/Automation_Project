[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "my_crewai_project"
version = "0.1.0"
description = "CrewAI example project scaffold"
requires-python = ">=3.10,<3.15"
dependencies = [
    "python-dotenv>=1.0.0",
]

[project.scripts]
my_crewai_project = "my_crewai_project.main:run"

[tool.crewai]
type = "crew"
